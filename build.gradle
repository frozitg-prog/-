plugins {
    id 'fabric-loom' version '1.13.6'
    id 'java'
}

// ---------------------------------------------------------------------------
// Матрица поддерживаемых версий Minecraft.
// Выбор версии:  gradlew build -Pmc=1.21.8
// Без флага собирается 1.21.4.
// ---------------------------------------------------------------------------
def versionMatrix = [
        '1.21.4'  : [yarn: '1.21.4+build.8',   fabric: '0.119.4+1.21.4'],
        '1.21.5'  : [yarn: '1.21.5+build.1',   fabric: '0.128.2+1.21.5'],
        '1.21.6'  : [yarn: '1.21.6+build.1',   fabric: '0.128.2+1.21.6'],
        '1.21.7'  : [yarn: '1.21.7+build.8',   fabric: '0.129.0+1.21.7'],
        '1.21.8'  : [yarn: '1.21.8+build.1',   fabric: '0.136.1+1.21.8'],
        '1.21.9'  : [yarn: '1.21.9+build.1',   fabric: '0.134.1+1.21.9'],
        '1.21.10' : [yarn: '1.21.10+build.3',  fabric: '0.138.4+1.21.10'],
        '1.21.11' : [yarn: '1.21.11+build.6',  fabric: '0.141.6+1.21.11'],
]

def mcVer = (findProperty('mc') ?: '1.21.4').toString()
if (!versionMatrix.containsKey(mcVer)) {
    throw new GradleException("Неподдерживаемая версия Minecraft: ${mcVer}. Доступны: ${versionMatrix.keySet()}")
}

ext {
    minecraft_version = mcVer
    yarn_mappings     = versionMatrix[mcVer].yarn
    fabric_version    = versionMatrix[mcVer].fabric
}

version = project.mod_version + "+" + mcVer
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

// Общий код + версия-специфичные адаптеры API и миксины
sourceSets {
    main {
        java {
            srcDir "src/ver/${mcVer}/java"
        }
        resources {
            srcDir "src/ver/${mcVer}/resources"
        }
    }
}

processResources {
    inputs.property "version", project.version
    inputs.property "mc", mcVer
    filesMatching("fabric.mod.json") {
        expand "version": project.version, "mc": mcVer
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = "UTF-8"
}

jar {
    from("LICENSE")
    manifest {
        attributes(
                "Implementation-Title": project.name,
                "Implementation-Version": project.version,
                "Implementation-Minecraft": mcVer
        )
    }
}
